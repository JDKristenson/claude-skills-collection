<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Reference directory provenance and safe browsing</title><desc id="desc">Upstream curation flows into an inherited README snapshot and links to external skill sources. Fork-local documentation is separate from external skill evaluation and optional use.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e293b"/></marker></defs><rect width="1200" height="700" fill="#ffffff"/><text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b"><tspan x="600" dy="0">Reference directory | provenance and safe browsing</tspan></text><rect x="40" y="100" width="320" height="110" rx="10" fill="none" stroke="#1e293b" stroke-width="2"/><text x="200" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e293b"><tspan x="200" dy="0">UPSTREAM DIRECTORY</tspan><tspan x="200" dy="18.75">Abu Bakar Siddik + contributors</tspan><tspan x="200" dy="18.75">Original curation and source links</tspan></text><rect x="440" y="100" width="320" height="110" rx="10" fill="none" stroke="#1e293b" stroke-width="2"/><text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e293b"><tspan x="600" dy="0">INHERITED SNAPSHOT</tspan><tspan x="600" dy="18.75">README-only baseline</tspan><tspan x="600" dy="18.75">057cd206f482 (full SHA below)</tspan></text><rect x="840" y="100" width="320" height="110" rx="10" fill="none" stroke="#1e293b" stroke-width="2"/><text x="1000" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e293b"><tspan x="1000" dy="0">EXTERNAL SKILL SOURCES</tspan><tspan x="1000" dy="18.75">Anthropic + community authors</tspan><tspan x="1000" dy="18.75">Code, instructions, licenses, notices</tspan></text><rect x="440" y="320" width="320" height="110" rx="10" fill="none" stroke="#1e293b" stroke-width="2"/><text x="600" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e293b"><tspan x="600" dy="0">FORK-LOCAL DOCUMENTATION</tspan><tspan x="600" dy="18.75">Provenance + setup guidance + map</tspan><tspan x="600" dy="18.75">Reason AI-assisted; not original skills</tspan></text><rect x="840" y="320" width="320" height="110" rx="10" fill="none" stroke="#1e293b" stroke-width="2"/><text x="1000" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e293b"><tspan x="1000" dy="0">REVIEW BEFORE USE</tspan><tspan x="1000" dy="18.75">Read source, permissions and notices</tspan><tspan x="1000" dy="18.75">Check current client compatibility</tspan></text><rect x="840" y="540" width="320" height="110" rx="10" fill="none" stroke="#1e293b" stroke-width="2"/><text x="1000" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e293b"><tspan x="1000" dy="0">OPTIONAL EXTERNAL USE</tspan><tspan x="1000" dy="18.75">Follow that source's supported setup</tspan><tspan x="1000" dy="18.75">Not installed or verified by this fork</tspan></text><path d="M360 155 L440 155" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 155 L840 155" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 210 L600 320" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1000 210 L1000 320" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1000 430 L1000 540" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e293b"><tspan x="400" dy="0">Baseline: 057cd206f48203e5702c0f990803a152f46cbe56</tspan></text><text x="400" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e293b"><tspan x="400" dy="0">Workflow recommendation, not runtime architecture.</tspan><tspan x="400" dy="18.75">No JD original-skill authorship claim; external behavior unverified.</tspan></text></svg>
